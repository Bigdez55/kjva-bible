stack: kjv_tokenless_master_stack
delegate_recipe: Bible_Tokenless_POC/training/kjv_retrain.yaml
tokenless_home: ml-training
python_bin: ml-training/.venv/bin/python

initial_artifacts:
  - eng-kjv_vpl
  - eng-kjv_html
  - eng-kjv_browserBible

execution_policy:
