[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenless-models-substrate"
version = "0.4.0"
description = "Identity-neutral Tokenless Models substrate template — wired federation, agent runtime, governance, soul manager"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Desmond Early" }]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
include = ["xmind_federation*", "heptagon*", "governance*", "soul_manager*"]
exclude = ["ai*", "tests*", "training*"]

[tool.ruff]
line-length = 100
target-version = "py311"
