[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ess-agent-relay"
version = "0.1.0"
description = "Provider-neutral, single-host durable execution continuity controller"
requires-python = ">=3.11"
authors = [{name = "Early Solution Systems"}]
readme = "README.md"
license = {text = "Proprietary; provided to the requesting owner for use and modification."}
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX"]
dependencies = []

[project.scripts]
relayctl = "agent_relay.cli:main"
relay-doctor = "agent_relay.cli:doctor_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_relay = ["schema.sql"]
